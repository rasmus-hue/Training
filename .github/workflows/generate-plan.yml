name: Generate training plan

on:
  schedule:
    # 20 min after the Garmin sync (garmin-sync.yml runs at 11:00 UTC), so
    # today's adherence check sees freshly synced activity data.
    - cron: "20 11 * * *"
  workflow_dispatch:
    inputs:
      fresh_start:
        description: "Skip this run's under-execution volume pullback (one-off reset, e.g. after a week lost to illness/life)"
        required: false
        default: "false"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate and push the plan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRESH_START: ${{ github.event.inputs.fresh_start || 'false' }}
        run: python files/generate_plan.py
