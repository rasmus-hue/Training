name: Generate training plan

on:
  schedule:
    # 20 min after the Garmin sync (garmin-sync.yml runs at 11:00 UTC), so
    # today's adherence check sees freshly synced activity data.
    - cron: "20 11 * * *"
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate and push the plan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python files/generate_plan.py
