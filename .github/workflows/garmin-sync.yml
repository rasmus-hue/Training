name: Garmin sync

on:
  schedule:
    # Hourly during Danish daytime only (06:00-23:00 Europe/Copenhagen), so
    # you get fresh data through the day without pointless syncs while
    # you're asleep. Cron is UTC and doesn't shift for Danish DST -- this is
    # 04:00-21:00 UTC, correct for CEST (summer). Once clocks fall back in
    # late October, shift both hours 1 earlier (03-20) to stay 06:00-23:00
    # local, or ask Claude to do it.
    - cron: "0 4-21 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to pull (use a big number once for a one-off historical backfill)"
        required: false
        default: "3"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r files/requirements.txt

      - name: Sync Garmin data
        env:
          GARMIN_TOKEN_B64: ${{ secrets.GARMIN_TOKEN_B64 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DAYS: ${{ github.event.inputs.days || '1' }}
        run: |
          python files/sync_garmin.py --days "$DAYS" --sink supabase
          # Files-only mode (no database, no dashboard): comment the line
          # above and uncomment below. You'd then need a separate step to
          # do something with the garmin/ folder, since Actions runners
          # don't persist disk between runs.
          # python files/sync_garmin.py --days 3 --sink files --out ./garmin
