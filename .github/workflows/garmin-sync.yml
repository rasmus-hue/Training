name: Garmin sync

on:
  schedule:
    # GitHub's own scheduler doesn't reliably honor sub-hourly cron in
    # practice (confirmed: requested */15, actually landed 40-100 min apart)
    # -- this is just an honest hourly backstop in case the external 15-min
    # trigger (an outside cron service calling this workflow's
    # workflow_dispatch API) ever lapses. Daytime only (06:00-23:00
    # Europe/Copenhagen = 04:00-21:00 UTC in summer; shift 1 hour earlier
    # once clocks fall back in late October).
    - cron: "0 4-21 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to pull (use a big number once for a one-off historical backfill)"
        required: false
        default: "3"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r files/requirements.txt

      - name: Sync Garmin data
        env:
          GARMIN_TOKEN_B64: ${{ secrets.GARMIN_TOKEN_B64 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DAYS: ${{ github.event.inputs.days || '1' }}
        run: |
          python files/sync_garmin.py --days "$DAYS" --sink supabase
          # Files-only mode (no database, no dashboard): comment the line
          # above and uncomment below. You'd then need a separate step to
          # do something with the garmin/ folder, since Actions runners
          # don't persist disk between runs.
          # python files/sync_garmin.py --days 3 --sink files --out ./garmin
