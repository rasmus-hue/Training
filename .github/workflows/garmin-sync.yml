name: Garmin sync

on:
  schedule:
    # ~6am US Eastern. Cron is UTC -- shift this to fit your timezone.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to pull (use a big number once for a one-off historical backfill)"
        required: false
        default: "3"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r files/requirements.txt

      - name: Sync Garmin data
        env:
          GARMIN_TOKEN_B64: ${{ secrets.GARMIN_TOKEN_B64 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DAYS: ${{ github.event.inputs.days || '3' }}
        run: |
          python files/sync_garmin.py --days "$DAYS" --sink supabase
          # Files-only mode (no database, no dashboard): comment the line
          # above and uncomment below. You'd then need a separate step to
          # do something with the garmin/ folder, since Actions runners
          # don't persist disk between runs.
          # python files/sync_garmin.py --days 3 --sink files --out ./garmin
